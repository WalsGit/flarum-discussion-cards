version: 2
updates:
  # Backend: PHP / Composer (composer.json at the repository root)
  - package-ecosystem: "composer"
    directory: "/"
    target-branch: "master"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  # Frontend: the "npm" ecosystem also covers yarn (js/yarn.lock)
  - package-ecosystem: "npm"
    directory: "/js"
    target-branch: "master"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
